# One-time bootstrap: official Elasticsearch 9.2.5 run so the node creates
# HTTP keystore and certs. Uses the same volume name "esdata" as the main
# docker-compose.yml so after bootstrap you can run "docker compose up -d"
# and the existing data (and keystore) will be reused.
# Run: ./bootstrap-official-es.sh

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.5
    container_name: es01
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s -k -u elastic:${ELASTIC_PASSWORD:-changeme} https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  esdata:
    driver: local

networks:
  elastic:
    driver: bridge
