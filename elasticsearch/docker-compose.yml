# Elasticsearch 9.2.5 single-node for development/testing.
# Run: docker compose up -d
# Then run: ./setup-tokens.sh to generate and save credentials.
# APM Server receives OTLP traces (e.g. from otel-cpp-demo) and writes to Elasticsearch.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.5
    container_name: es01
    environment:
      - node.name=es01
      - cluster.name=es-docker
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=true
      # SSL: leave unset so ES auto-generates certs on first start
      # Set a known password so setup-tokens.sh can use it (change in production)
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s -k -u elastic:${ELASTIC_PASSWORD:-changeme} https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.2.5
    container_name: apm-server
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      - "8200:8200"
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_started

volumes:
  esdata:
    driver: local

networks:
  elastic:
    driver: bridge
